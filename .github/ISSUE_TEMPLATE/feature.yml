name: Feature
description: Suggest an action or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What an agent cannot do today, and in which app.
    validations:
      required: true
  - type: textarea
    id: user
    attributes:
      label: What the user must keep
      description: How the user's own pointer, focus and typing should be affected while it runs.
