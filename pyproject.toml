[project]
name = "deskpilot"
version = "0.7.0"
description = "Desktop control for agents on Hyprland: window-relative clicks that leave the user's pointer alone, and typing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cillian Berragan", email = "cjberragan@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["evdev>=1.7", "jeepney>=0.8", "pillow>=10", "mcp>=2.3", "pydantic>=2.8"]

[project.urls]
Homepage = "https://github.com/cjber/deskpilot"
Repository = "https://github.com/cjber/deskpilot"
Issues = "https://github.com/cjber/deskpilot/issues"
Changelog = "https://github.com/cjber/deskpilot/blob/main/CHANGELOG.md"

[project.scripts]
deskpilot = "deskpilot.cli:main"

[dependency-groups]
dev = ["fonttools>=4.58", "pytest>=8", "ruff>=0.12", "ty>=0.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = [
  "PLR2004",
  # evdev and the MCP server load only for the commands that need them, so `deskpilot windows` runs without
  # /dev/uinput access or the MCP stack.
  "PLC0415",
  # Actions take a window, a point, a button and the take-over flags, and the CLI dispatches one command per branch.
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0917",
]
